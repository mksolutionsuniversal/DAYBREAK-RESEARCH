<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
<title id="title">Porównanie zakresu dowodów Run 1–3</title><desc id="desc">W trzech przebiegach udokumentowano archiwizację; tylko Run 3 zachował ZIP do inwentaryzacji. Szczegółowa analiza PCAP dostępna dla Run 1 i 2.</desc>
